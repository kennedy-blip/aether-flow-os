name: Build and bundle Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: npm ci
      - run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aetherflow-android
          path: |
            public/releases/aetherflow-release.apk
            public/releases/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aetherflow-web-with-apk
          path: dist/
          if-no-files-found: error
      - name: Publish verified Android release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify public/releases/aetherflow-release.apk
          tag="android-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already published: $tag"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Android build ${GITHUB_SHA:0:7}" --notes 'Debug-signed universal APK for sideloading.' --latest=false public/releases/aetherflow-release.apk public/releases/manifest.json
          fi
